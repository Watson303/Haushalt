const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function oeffnen(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},key,ub(D.c));
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
}
async function ableiten(u,p){
  u=u.trim().toLowerCase();if(u==='luise')u='louise';
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  return new Uint8Array(await crypto.subtle.exportKey('raw',k));
}
(async()=>{
  let gem=null;try{gem=localStorage.getItem('hh.login')}catch(e){}
  if(gem){try{await oeffnen(ub(gem));return}catch(e){try{localStorage.removeItem('hh.login')}catch(e){}}}
  document.getElementById('login').style.display='';
})();
document.getElementById('login').addEventListener('submit',async ev=>{
  ev.preventDefault();const f=document.getElementById('f');f.textContent='Prüfe…';
  const merken=document.getElementById('m').checked;
  try{const raw=await ableiten(document.getElementById('u').value,document.getElementById('p').value);
    await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']),ub(D.c));
    if(merken){try{localStorage.setItem('hh.login',btoa(String.fromCharCode(...raw)))}catch(e){}}
    await oeffnen(raw);
  }catch(e){f.textContent='Benutzername oder Passwort falsch.'}
});
